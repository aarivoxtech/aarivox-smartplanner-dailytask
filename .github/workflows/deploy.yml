# ==============================================================================
# GITHUB ACTIONS: CI/CD PIPELINE (MASTER BRANCH ONLY)
# ==============================================================================
name: 🚀 Aarivox Smart Planner CI/CD

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      ENV_NAME: uat
      EC2_HOST: ${{ secrets.EC2_HOST }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      AWS_ACCESS_KEY: ${{ secrets.AWS_S3_ACCESS_KEY }}
      AWS_SECRET_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🏗️ Build Backend (Gradle)
        run: |
          cd aarivox-smartplanner-backend
          chmod +x gradlew
          ./gradlew bootJar -x test
          # Copy the SNAPSHOT jar to api.jar for consistent Ansible deployment
          cp build/libs/smart-planner-0.0.1-SNAPSHOT.jar build/libs/api.jar

      - name: 🏗️ Build Frontend (Angular)
        run: |
          cd aarivox-smartplanner-admin-application
          npm install --legacy-peer-deps
          npm run build

      - name: 🔐 Prepare SSH Credentials
        run: |
          echo "${{ secrets.EC2_PEM }}" > cricket-canvas-key-pair.pem
          chmod 400 cricket-canvas-key-pair.pem

      - name: 🛠️ Setup Ansible
        run: |
          python3 -m pip install ansible
          ansible-galaxy collection install ansible.posix community.general

      - name: 🚀 Execute Ansible Playbook
        run: |
          ansible-playbook -i "${{ env.EC2_HOST }}," \
            --private-key cricket-canvas-key-pair.pem \
            -u ubuntu \
            -e "ansible_ssh_common_args='-o StrictHostKeyChecking=no'" \
            ansible/playbook.yml \
            -e "env_name=${{ env.ENV_NAME }}" \
            -e "db_password=${{ env.DB_PASSWORD }}" \
            -e "aws_access_key=${{ env.AWS_ACCESS_KEY }}" \
            -e "aws_secret_key=${{ env.AWS_SECRET_KEY }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: False

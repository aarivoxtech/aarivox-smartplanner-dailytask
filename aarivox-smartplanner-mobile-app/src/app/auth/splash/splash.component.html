<ion-content [forceOverscroll]="false" class="splash-content">
  <div class="splash-container">
    <div class="logo-box animate-scale-in">
      <img src="assets/aarivox_logo.png" class="splash-logo" alt="Aarivox Logo" style="object-fit: contain; border-radius: 50%;" />
    </div>

    <div class="brand-info animate-fade-in">
      <h1 class="brand-title">Aarivox</h1>
      <p class="brand-tagline">Track • Plan • Grow</p>
    </div>

    <div class="loader-container">
      <div class="loader-bar"></div>
    </div>
  </div>
</ion-content>
